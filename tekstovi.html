<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tekstovi Kralja Čačka</title>
<meta name="description" content="Tekstovi pesama Kralja Čačka sa albuma Zemlja snova (2016) i Spusti svetlost na put (2019).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Barlow+Condensed:wght@400;500;600&family=Barlow:wght@400;500&display=swap">
<style>
/* Layout: fiksna monohromna pozadina (ista fotografija kao na naslovnoj, -30%).
   Leva 1/3: logo + meni, ispod harmonika sa albumima (sticky, ne skroluje se sa stranom).
   Desna 2/3: tekst izabrane pesme. BIO + mreže fiksno dole desno. Telefon: jedna kolona, tekst se otvara ispod pesme. */
:root{
  --black:#050505;
  --ink:#111112;
  --graphite:#1f1f21;
  --ash:#8a8a8c;
  --mist:#b9b8b4;
  --bone:#e4e3df;
  --line:rgba(228,227,223,.14);
  --line-strong:rgba(228,227,223,.38);
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --util:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --text:"Barlow","Helvetica Neue",Arial,sans-serif;
  --top:calc(3vh + env(safe-area-inset-top,0px));
  --gutter-l:max(16px, 3vw, env(safe-area-inset-left,0px));
  --gutter-r:max(16px, 3vw, env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--black)}
body{margin:0;background:var(--black);color:var(--bone);font-family:var(--util);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a:focus-visible,button:focus-visible{outline:2px solid var(--bone);outline-offset:4px}

/* Fiksna pozadina — ne pomera se pri skrolovanju */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%, var(--ink) 0%, var(--black) 70%)}
.photo{position:absolute;top:0;left:50%;height:100%;aspect-ratio:1/1;max-width:none;transform:translateX(-50%);
  background:url("img/hero.jpg") center/cover no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 26%,#000 74%,transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0%,#000 26%,#000 74%,transparent 100%);
  filter:grayscale(1) contrast(1.05) brightness(.7)}
.shade{position:absolute;inset:0;
  background:
    linear-gradient(90deg,var(--black) 0%,rgba(5,5,5,0) 30%,rgba(5,5,5,0) 70%,var(--black) 100%),
    linear-gradient(180deg,rgba(5,5,5,.35) 0%,rgba(5,5,5,0) 30%,rgba(5,5,5,0) 65%,rgba(5,5,5,.85) 100%)}

/* Osnovni raspored 1/3 + 2/3 */
.page{position:relative;z-index:1;display:grid;grid-template-columns:1fr 2fr;min-height:100vh;
  padding-left:var(--gutter-l);padding-right:var(--gutter-r)}

/* Leva kolona */
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--graphite) transparent;
  padding-block:var(--top) 5vh;padding-right:clamp(16px,2.5vw,40px);
  display:flex;flex-direction:column;gap:clamp(18px,3.5vh,36px);min-width:0;container-type:inline-size}
.head{display:flex;align-items:center;gap:clamp(18px,2.2vw,36px)}
.logo{display:block;height:25vh;flex:none}
.logo img{height:100%;width:auto;max-width:none;display:block}
.menu{display:flex;flex-direction:column;gap:.15em;
  font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  font-size:min(3.3vh, 8cqi);line-height:1}
.menu a{display:inline-flex;align-items:center;gap:.4em;color:var(--ash);padding-block:.12em;transition:color .25s}
.menu a::before{content:"";width:0;height:2px;background:currentColor;transition:width .3s ease}
.menu a:hover,.menu a:focus-visible{color:var(--bone)}
.menu a:hover::before,.menu a:focus-visible::before{width:.6em}

.intro h1{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;
  font-size:min(5.5vh, 15cqi);line-height:.9}
.intro p{margin:.45em 0 0;font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ash)}

/* Harmonika */
.albums{display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
.album{border-top:1px solid var(--line)}
.album{--cover:clamp(56px, 24cqi, 120px)}
.album-head{width:100%;display:grid;grid-template-columns:var(--cover) 1fr auto;align-items:center;gap:clamp(12px,1.4vw,22px);
  padding-block:14px}
.album-head img{width:var(--cover);height:var(--cover);max-width:100%;object-fit:cover;display:block;
  filter:grayscale(1) brightness(.75);transition:filter .5s ease, transform .5s ease}
.album-head:hover img{filter:grayscale(.6) brightness(.95)}
.album.open .album-head img{filter:none}
.album-meta{min-width:0}
.album-meta strong{display:block;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;
  font-size:clamp(17px,6.2cqi,28px);line-height:.95;text-wrap:balance;color:var(--mist);transition:color .25s}
.album.open .album-meta strong,.album-head:hover .album-meta strong{color:var(--bone)}
.album-meta span{display:block;margin-top:6px;font-size:13px;font-weight:500;letter-spacing:clamp(.08em,.6cqi,.2em);text-transform:uppercase;color:var(--ash)}
.chev{width:22px;height:22px;color:var(--ash);transition:transform .4s ease,color .25s}
.album.open .chev{transform:rotate(180deg);color:var(--bone)}

.songs-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
.album.open .songs-wrap{grid-template-rows:1fr}
.songs-wrap > div{overflow:hidden;min-height:0}
.songs{list-style:none;margin:0;padding:2px 0 16px}
.song{display:flex;align-items:center;gap:.6em;width:100%;padding:6px 0;
  font-size:clamp(15px,4.6cqi,19px);font-weight:500;letter-spacing:.02em;line-height:1.2;color:var(--ash);transition:color .2s}
.song::before{content:"";flex:none;width:8px;height:1px;background:var(--line-strong);transition:width .3s ease, background .3s}
.song:hover,.song:focus-visible{color:var(--mist)}
.song[aria-current="true"]{color:var(--bone)}
.song[aria-current="true"]::before{width:22px;background:var(--bone)}

/* Desna kolona: tekst pesme */
.main{min-width:0;container-type:inline-size;
  padding-top:calc(var(--top) + 1vh);padding-bottom:20vh;
  padding-left:clamp(16px,4vw,72px);padding-right:clamp(150px,16vw,250px)}
.lyric{max-width:68ch;text-shadow:0 1px 14px rgba(0,0,0,.85)}
.lyric.swap{animation:swap .45s ease both}
@keyframes swap{from{opacity:.25;translate:0 8px}to{opacity:1;translate:0 0}}
.eyebrow{margin:0 0 .9em;font-size:13px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--ash)}
.lyric h2{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;
  font-size:clamp(40px,7.5vh,88px);line-height:.9;text-wrap:balance}
.rule{width:56px;height:2px;background:var(--bone);margin:clamp(20px,3.5vh,34px) 0}
.verses{font-family:var(--text);font-size:clamp(16px,1.2vw,19px);line-height:1.6;color:var(--bone)}
.verses p{margin:0 0 1.25em;break-inside:avoid}
@container (min-width:560px){ .verses.long{columns:2;column-gap:clamp(28px,4cqi,64px)} }

/* BIO + mreže: fiksno dole desno, kao na naslovnoj */
.corner{position:fixed;z-index:3;
  right:max(3vw, calc(16px + env(safe-area-inset-right,0px)));
  bottom:calc(4vh + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:stretch;gap:14px}
.bio{display:inline-flex;align-items:center;gap:.35em;
  font-family:var(--display);font-weight:800;font-size:clamp(34px,6vh,64px);line-height:.85;letter-spacing:.04em;color:var(--bone)}
.bio svg{width:.8em;height:.8em;transition:transform .3s ease}
.bio:hover svg,.bio:focus-visible svg{transform:translateX(.18em)}
.bio small{display:block;font-family:var(--util);font-weight:500;font-size:12px;letter-spacing:.24em;color:var(--ash);text-align:right;margin-bottom:6px}
.links{display:flex;flex-direction:column;align-items:stretch;gap:10px;--ic:clamp(26px,3.6vh,36px)}
.links .tag{text-align:right}
.row{display:flex;justify-content:space-between;gap:14px}
.row a{width:var(--ic);height:var(--ic);display:block;color:var(--ash);transition:color .25s,transform .25s}
.row a:hover,.row a:focus-visible{color:var(--bone);transform:translateY(-2px)}
.row svg{width:100%;height:100%;display:block;fill:currentColor}
.tag{font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:#5a5a5c}
.fade-bottom{position:fixed;left:0;right:0;bottom:0;height:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(5,5,5,0),var(--black) 70%)}

@media (prefers-reduced-motion:no-preference){
  .photo{animation:fade 1.6s ease both}
  .head,.intro,.albums{animation:rise .8s ease both}
  .intro{animation-delay:.1s}.albums{animation-delay:.2s}
  .main{animation:rise .8s .3s ease both}
  .corner{animation:rise .8s .5s ease both}
}
@media (prefers-reduced-motion:reduce){
  .lyric.swap{animation:none}
  .songs-wrap,.chev,.album-head img{transition:none}
}
@keyframes fade{from{opacity:.2}to{opacity:1}}
@keyframes rise{from{opacity:.15;translate:0 12px}to{opacity:1;translate:0 0}}

/* Portretni ekrani (tablet): BIO i mreže u redu na dnu */
@media (max-aspect-ratio:1/1){
  .logo{height:17vh}
  .corner{flex-direction:row;align-items:flex-end;gap:16px;bottom:calc(2vh + env(safe-area-inset-bottom,0px))}
  .bio{font-size:clamp(28px,5vh,44px)}
  .tag{display:none}
  .main{padding-right:0;padding-bottom:18vh}
  .side{padding-bottom:14vh}
  .fade-bottom{height:16vh}
}
@media (max-height:560px) and (min-aspect-ratio:1/1){ .corner{gap:8px}.tag{display:none} }

/* Telefon: jedna kolona, tekst se otvara ispod naziva pesme */
@media (max-width:700px){
  .page{grid-template-columns:1fr}
  .side{position:static;height:auto;overflow:visible;padding-right:0;padding-bottom:calc(16vh + env(safe-area-inset-bottom,0px))}
  .main{display:none}
  .menu{font-size:clamp(20px,6vw,28px)}
  .album{--cover:76px}
  .menu{font-size:clamp(20px,6vw,28px)}
  .intro h1{font-size:clamp(36px,11vw,52px)}
  .album-meta strong{font-size:22px}
  .song{font-size:18px;padding:9px 0}
  .songs .lyric{padding:6px 0 22px 30px}
  .songs .lyric h2,.songs .lyric .eyebrow{display:none}
  .songs .rule{width:32px;margin:6px 0 16px}
  .songs .verses{font-size:16px}
  .corner{left:max(16px,env(safe-area-inset-left,0px));justify-content:space-between}
  .links{--ic:24px}
}
</style>

</head>

  }
  function toggleAlbum(ai){
    var willOpen = !albumsEl.children[ai].classList.contains('open');
    for (var i = 0; i < albums.length; i++) setOpen(i, i === ai && willOpen);
    if (willOpen && !phone.matches && (!current || current.a !== ai)) show(ai, 0);
  }

  function render(ai, si){
    var a = albums[ai], s = a.songs[si];
    var lines = 0;
    s.stanzas.forEach(function(st){ lines += st.length + 1; });
    lyricEl.innerHTML =
      '<p class="eyebrow">' + esc(a.title) + ' · ' + a.year + '</p>' +
      '<h2>' + esc(s.title) + '</h2>' +
      '<div class="rule"></div>' +
      '<div class="verses' + (lines > 44 ? ' long' : '') + '">' +
        s.stanzas.map(function(st){ return '<p>' + st.map(esc).join('<br>') + '</p>'; }).join('') +
      '</div>';
    lyricEl.classList.remove('swap'); void lyricEl.offsetWidth; lyricEl.classList.add('swap');
  }

  function mark(ai, si){
    albumsEl.querySelectorAll('.song').forEach(function(b){
      b.setAttribute('aria-current', (+b.dataset.a === ai && +b.dataset.s === si) ? 'true' : 'false');
    });
  }

  function show(ai, si){
    if (current && current.a === ai && current.s === si) return;
    current = {a: ai, s: si};
    mark(ai, si);
    render(ai, si);
    if (phone.matches) {
      var btn = albumsEl.querySelector('.song[data-a="' + ai + '"][data-s="' + si + '"]');
      btn.parentNode.appendChild(lyricEl);
    } else {
      if (lyricEl.parentNode !== mainEl) mainEl.appendChild(lyricEl);
      if (window.scrollY > 0) window.scrollTo(0, 0);
    }
    try { history.replaceState(null, '', '#' + albums[ai].songs[si].id); } catch(e) {}
  }

  function hide(){
    current = null;
    mark(-1, -1);
    lyricEl.innerHTML = '';
    if (lyricEl.parentNode !== mainEl) mainEl.appendChild(lyricEl);
  }

  /* Prelazak mišem prikazuje tekst; klik (dodir, tastatura) takođe */
  albumsEl.addEventListener('pointerover', function(e){
    if (e.pointerType !== 'mouse' || phone.matches) return;
    var b = e.target.closest('.song'); if (!b) return;
    clearTimeout(hoverTimer);
    hoverTimer = setTimeout(function(){ show(+b.dataset.a, +b.dataset.s); }, 90);
  });
  albumsEl.addEventListener('pointerout', function(e){
    if (e.target.closest('.song')) clearTimeout(hoverTimer);
  });
  albumsEl.addEventListener('click', function(e){
    var b = e.target.closest('.song'); if (!b) return;
    var ai = +b.dataset.a, si = +b.dataset.s;
    if (phone.matches && current && current.a === ai && current.s === si) { hide(); return; }
    show(ai, si);
    if (phone.matches) b.scrollIntoView({block:'start', behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'});
  });
  albumsEl.addEventListener('focusin', function(e){
    var b = e.target.closest('.song');
    if (b && !phone.matches) show(+b.dataset.a, +b.dataset.s);
  });

  /* Promena širine ekrana: tekst se vraća u desnu kolonu ili ide ispod pesme */
  phone.addEventListener('change', function(){
    if (!current) { if (!phone.matches) show(0, 0); return; }
    var c = current; current = null; show(c.a, c.s);
  });

  /* Početno stanje: link sa #pesma ili prva pesma najstarijeg albuma */
  var start = {a: 0, s: 0}, h = (location.hash || '').slice(1);
  if (h) albums.forEach(function(a, ai){ a.songs.forEach(function(s, si){ if (s.id === h) start = {a: ai, s: si}; }); });
  for (var i = 0; i < albums.length; i++) setOpen(i, i === start.a);
  if (!phone.matches || h) show(start.a, start.s);
})();
</script>
</body>
</html>
