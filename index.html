<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kralj Čačka</title>
<meta name="description" content="Kralj Čačka — kantautor i slikar. Vesti, muzika, tekstovi i slikarstvo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: jedan ekran, bez skrolovanja. Fotografija po celoj visini u sredini, crni prelivi levo/desno,
   logo gore levo (1/4 visine), mreža 2x2 u centru (~60% visine), BIO + mreže dole desno. */
:root{
  --black:#050505;
  --ink:#111112;          /* tamno siva */
  --graphite:#1f1f21;     /* srednje tamna */
  --ash:#8a8a8c;          /* svetlija siva */
  --bone:#e4e3df;         /* najsvetlija siva za tekst */
  --line:rgba(228,227,223,.18);
  --tile-alpha:.25;       /* 75% transparentnosti */
  --gap:15px;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --util:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --grid:min(60vh, 60vw);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--black);color:var(--bone);
  font-family:var(--util);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--bone);outline-offset:4px}

.stage{position:relative;width:100%;height:100%;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%, var(--ink) 0%, var(--black) 70%)}

/* Pozadinska fotografija */
.photo{
  position:absolute;top:0;left:50%;height:100%;aspect-ratio:1/1;max-width:none;
  transform:translateX(-50%);
  background:url("img/hero.jpg") center/cover no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 26%,#000 74%,transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0%,#000 26%,#000 74%,transparent 100%);
  filter:grayscale(.15) contrast(1.05);
}
/* dodatno zatamnjenje rubova i dna da sve ostane mekano */
.shade{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,var(--black) 0%,rgba(5,5,5,0) 30%,rgba(5,5,5,0) 70%,var(--black) 100%),
    linear-gradient(180deg,rgba(5,5,5,.35) 0%,rgba(5,5,5,0) 30%,rgba(5,5,5,0) 65%,rgba(5,5,5,.85) 100%);
}

/* Logo */
.logo{position:absolute;z-index:3;
  top:calc(3vh + env(safe-area-inset-top,0px));
  left:max(3vw, calc(16px + env(safe-area-inset-left,0px)));
  height:25vh;display:block}
.logo img{height:100%;width:auto;max-width:none;display:block}

/* Mreža 2x2 */
.grid{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);
  width:var(--grid);height:var(--grid);
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:var(--gap)}
.tile{position:relative;display:block;container-type:inline-size;aspect-ratio:1/1;max-width:100%;overflow:hidden;isolation:isolate}
.tile .ph{position:absolute;inset:0;z-index:-1;opacity:var(--tile-alpha);
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 1px,transparent 1px 14px),
    linear-gradient(160deg,var(--graphite),var(--ink) 60%,var(--black));
  transition:opacity .35s ease, transform .6s ease}
.tile::after{content:"";position:absolute;inset:0;border:1px solid var(--line);pointer-events:none;transition:border-color .35s}
.tile .label{position:absolute;left:7%;bottom:6%;right:7%;
  font-family:var(--display);font-weight:800;text-transform:uppercase;
  font-size:13cqi;line-height:.9;letter-spacing:.03em;white-space:nowrap;
  color:var(--bone);text-shadow:0 2px 18px rgba(0,0,0,.7)}
.tile .pic{position:absolute;inset:0;z-index:-1;opacity:0;background:center/cover no-repeat;filter:grayscale(1) contrast(1.08);transition:opacity .45s ease, transform .8s ease;transform:scale(1.04)}
.tile:hover .pic,.tile:focus-visible .pic{opacity:.9;transform:scale(1)}
.tile:hover .ph,.tile:focus-visible .ph{opacity:.55;transform:scale(1.03)}
.tile:hover::after,.tile:focus-visible::after{border-color:rgba(228,227,223,.5)}

/* Dole desno: BIO + mreže */
.corner{position:absolute;z-index:3;
  right:max(3vw, calc(16px + env(safe-area-inset-right,0px)));
  bottom:calc(4vh + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:stretch;gap:14px}
.bio{display:inline-flex;align-items:center;gap:.35em;
  font-family:var(--display);font-weight:800;font-size:clamp(34px,6vh,64px);line-height:.85;letter-spacing:.04em;color:var(--bone)}
.bio svg{width:.8em;height:.8em;transition:transform .3s ease}
.bio:hover svg,.bio:focus-visible svg{transform:translateX(.18em)}
.bio small{display:block;font-family:var(--util);font-weight:500;font-size:12px;letter-spacing:.24em;color:var(--ash);text-align:right;margin-bottom:6px}
.links{display:flex;flex-direction:column;align-items:stretch;gap:10px;--ic:clamp(26px,3.6vh,36px)}
.links .tag{text-align:right}
.row{display:flex;justify-content:space-between;gap:14px}
.row a{width:var(--ic);height:var(--ic);display:block;color:var(--ash);transition:color .25s,transform .25s}
.row a:hover,.row a:focus-visible{color:var(--bone);transform:translateY(-2px)}
.row svg{width:100%;height:100%;display:block;fill:currentColor}
.tag{font-size:12px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:#5a5a5c}

/* Ulazna animacija */
@media (prefers-reduced-motion:no-preference){
  .photo{animation:fade 1.6s ease both}
  .logo{animation:rise .9s .2s ease both}
  .tile{animation:rise .8s ease both}
  .tile:nth-child(1){animation-delay:.35s}.tile:nth-child(2){animation-delay:.45s}
  .tile:nth-child(3){animation-delay:.55s}.tile:nth-child(4){animation-delay:.65s}
  .corner{animation:rise .8s .8s ease both}
}
@keyframes fade{from{opacity:.2}to{opacity:1}}
@keyframes rise{from{opacity:.15;translate:0 12px}to{opacity:1;translate:0 0}}

/* Uski / portretni ekrani */
@media (max-aspect-ratio:1/1){
  :root{--grid:min(52vh, calc(100vw - 32px))}
  .logo{height:17vh}
  .grid{top:calc(50% + 2vh)}
  .corner{flex-direction:row;align-items:flex-end;gap:16px;bottom:calc(2vh + env(safe-area-inset-bottom,0px))}
  .bio{font-size:clamp(28px,5vh,44px)}
  .tag{display:none}
}
@media (max-aspect-ratio:1/1) and (max-width:560px){
  .grid{top:calc(22vh + env(safe-area-inset-top,0px));bottom:calc(12vh + env(safe-area-inset-bottom,0px));height:auto;transform:translateX(-50%);
    grid-template-columns:1fr;grid-template-rows:repeat(4,1fr);gap:10px}
  .tile{aspect-ratio:auto}
  .tile .label{font-size:10cqi;bottom:auto;top:50%;transform:translateY(-50%)}
  .corner{left:max(16px,env(safe-area-inset-left,0px));justify-content:space-between}
  .links{align-items:flex-end}
  .links{--ic:24px}
  .row{gap:14px}
}
@media (max-height:520px) and (min-aspect-ratio:1/1){
  .corner{gap:8px}.tag{display:none}
}
</style>

</head>
